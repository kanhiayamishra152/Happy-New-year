<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&family=Great+Vibes&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #000; overflow: hidden; font-family: 'Poppins', sans-serif; color: white; height: 100vh; width: 100vw; position: relative; }
        
        /* Fireworks Canvas */
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }

        /* Screens */
        .screen {
            position: absolute; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1s ease;
        }

        #setup-screen { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); }
        #receiver-screen { background: linear-gradient(135deg, #200122, #6f0000); display: none; z-index: 15; }
        #wish-screen { display: none; pointer-events: none; }
        
        .interactive-area { pointer-events: auto; text-align: center; display: flex; flex-direction: column; align-items: center; }

        /* Input Card */
        .input-box {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px);
            padding: 30px; border-radius: 20px; text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            width: 90%; max-width: 400px;
        }

        input[type="text"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 50px; border: none; outline: none; text-align: center; font-size: 16px; }
        input[type="file"] { margin: 10px 0; color: white; font-size: 0.9rem; }

        /* Buttons */
        .btn {
            background: linear-gradient(45deg, #ff0055, #ff00aa); color: white; padding: 12px 30px;
            border: none; border-radius: 50px; cursor: pointer; font-size: 18px; margin-top: 15px;
            font-weight: bold; box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4); animation: pulse 2s infinite;
        }
        .btn:disabled { background: #555; cursor: wait; animation: none; box-shadow: none; opacity: 0.7; }

        .btn-create-new { background: transparent; border: 2px solid #00ffea; color: #00ffea; padding: 8px 20px; margin-top: 15px; font-size: 14px; }

        /* Texts & Effects */
        .title-text { font-family: 'Great Vibes', cursive; font-size: 4rem; color: #fff; text-shadow: 0 0 10px #ff00de; animation: glow 2s infinite alternate; }
        .year-text { font-size: 6rem; font-weight: 900; background: -webkit-linear-gradient(#ffe600, #ff8c00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        
        /* Photo Styling */
        .photo-wrapper { position: relative; margin: 20px 0; width: 200px; height: 200px; }
        .user-photo { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 5px solid white; box-shadow: 0 0 30px rgba(255, 255, 255, 0.8); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
        .scan-ring { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 3px dashed #00ffea; animation: spin 4s linear infinite; }
        
        .sender-name { font-size: 2rem; font-weight: bold; color: #ffd700; text-transform: capitalize; margin-top: 5px; }
        .whatsapp-btn { margin-top: 20px; background: #25D366; color: white; text-decoration: none; padding: 10px 20px; border-radius: 50px; font-weight: bold; display: inline-flex; align-items: center; cursor: pointer; border:none; }
        
        #loading-msg { display: none; color: #00ffea; margin-top: 15px; font-size: 0.9rem; font-weight: bold;}

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes glow { to { text-shadow: 0 0 20px #00ffff; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @media (max-width: 600px) { .title-text { font-size: 3rem; } .year-text { font-size: 4rem; } }
    </style>
</head>
<body>

    <!-- Audio File -->
    <audio id="music-player" loop><source src="Happy.mp3" type="audio/mpeg"></audio>
    
    <!-- Background Fireworks -->
    <canvas id="canvas"></canvas>

    <!-- 1. SETUP SCREEN (For Creator) -->
    <div id="setup-screen" class="screen">
        <div class="input-box">
            <h1 style="font-family: 'Great Vibes'; font-size: 2.5rem; margin-bottom: 10px;">Welcome</h1>
            <p>Create your magic wish for 2026!</p>
            <input type="text" id="username" placeholder="Enter Your Name" required>
            <p style="font-size: 0.8rem; margin-top: 10px; color: #ccc;">Select Your Photo:</p>
            <input type="file" id="userimg" accept="image/*">
            <div id="loading-msg">Uploading Photo... Please wait ⏳</div>
            <button class="btn" id="create-btn" onclick="processUserWish()">Create Status ✨</button>
        </div>
    </div>

    <!-- 2. RECEIVER SCREEN (For Viewer) -->
    <div id="receiver-screen" class="screen">
        <div class="input-box">
            <h1 style="font-family: 'Great Vibes'; font-size: 2.5rem; color:#ffd700;">Surprise! 🎁</h1>
            <p style="font-size: 1.2rem; margin: 15px 0;">
                <span id="sender-display-name" style="font-weight:bold; color: #00ffea;">Someone</span>
                has sent you a special New Year wish!
            </p>
            <button class="btn" onclick="openReceivedWish()">Open Wish 🔓</button>
        </div>
    </div>

    <!-- 3. FINAL WISH SCREEN (The Status) -->
    <div id="wish-screen" class="screen">
        <div class="title-text">Happy New Year</div>
        <div class="year-text">2026</div>

        <div class="interactive-area">
            <div class="photo-wrapper">
                <div class="scan-ring"></div>
                <!-- Default Image placeholder -->
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213518.png" id="final-photo" class="user-photo" alt="Photo">
            </div>

            <div style="background: rgba(0,0,0,0.6); padding: 5px 20px; border-radius: 20px;">
                <div style="color: #eee; font-size: 0.9rem;">Wishing you joy & success!</div>
                <div style="color: #bbb; font-size: 0.8rem;">From:</div>
                <div class="sender-name" id="final-name">Name</div>
            </div>

            <button class="whatsapp-btn" id="share-btn" onclick="shareOnWhatsApp()">Share on WhatsApp 🚀</button>
            <button class="btn btn-create-new" id="create-new-btn" onclick="resetToHome()" style="display:none;">Create Your Own ➕</button>
        </div>
    </div>

    <script>
        // ==========================================
        //  YOUR API KEY IS HERE
        // ==========================================
        const IMGBB_API_KEY = "e2e1a14ef34ed25e0344727a71f65a6d"; 
        // ==========================================

        const music = document.getElementById('music-player');
        const setupScreen = document.getElementById('setup-screen');
        const receiverScreen = document.getElementById('receiver-screen');
        const wishScreen = document.getElementById('wish-screen');
        const loadingMsg = document.getElementById('loading-msg');
        const createBtn = document.getElementById('create-btn');
        
        let currentName = "";
        let currentPhotoUrl = "https://cdn-icons-png.flaticon.com/512/4213/4213518.png"; // Default image

        // --- 1. CHECK URL ON LOAD ---
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const senderName = urlParams.get('n');
            const senderImg = urlParams.get('img');

            if (senderName) {
                // VIEWER MODE (Dost dekh raha hai)
                currentName = decodeURIComponent(senderName);
                if(senderImg) currentPhotoUrl = decodeURIComponent(senderImg);
                
                // Form mat dikhao, Surprise box dikhao
                setupScreen.style.display = 'none';
                receiverScreen.style.display = 'flex';
                
                // Update DOM elements
                document.getElementById('sender-display-name').innerText = currentName;
                document.getElementById('final-name').innerText = currentName;
                document.getElementById('final-photo').src = currentPhotoUrl;
                
                // Show 'Create New' button, hide 'Share' button initially
                document.getElementById('create-new-btn').style.display = 'inline-block';
                document.getElementById('share-btn').style.display = 'none';
            } else {
                // CREATOR MODE (Aap bana rahe ho)
                setupScreen.style.display = 'flex';
            }
        };

        // --- 2. UPLOAD TO IMGBB ---
        function processUserWish() {
            const nameInput = document.getElementById('username').value;
            const fileInput = document.getElementById('userimg').files[0];

            if (!nameInput) { alert("Please enter your name!"); return; }
            currentName = nameInput;
            document.getElementById('final-name').innerText = currentName;

            if (fileInput) {
                // Upload Animation Start
                loadingMsg.style.display = 'block';
                createBtn.disabled = true;
                createBtn.innerText = "Processing...";

                const formData = new FormData();
                formData.append("image", fileInput);

                // Sending to ImgBB
                fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                    method: "POST",
                    body: formData
                })
                .then(response => response.json())
                .then(result => {
                    if (result.success) {
                        currentPhotoUrl = result.data.url; // Hamko Link mil gaya!
                        document.getElementById('final-photo').src = currentPhotoUrl;
                        showWishScreen();
                    } else {
                        alert("Photo upload failed. Please try a different photo.");
                        resetForm();
                    }
                })
                .catch(error => {
                    console.error("Error:", error);
                    alert("Internet Connection Error. Photo upload failed.");
                    resetForm();
                });
            } else {
                // No photo uploaded, use default
                showWishScreen();
            }
        }

        function resetForm() {
            loadingMsg.style.display = 'none';
            createBtn.disabled = false;
            createBtn.innerText = "Create Status ✨";
        }

        // --- 3. TRANSITIONS & MUSIC ---
        function showWishScreen() {
            playMusic();
            setupScreen.style.opacity = '0';
            setTimeout(() => {
                setupScreen.style.display = 'none';
                wishScreen.style.display = 'flex';
            }, 500);
        }

        function openReceivedWish() {
            playMusic();
            receiverScreen.style.opacity = '0';
            setTimeout(() => {
                receiverScreen.style.display = 'none';
                wishScreen.style.display = 'flex';
            }, 500);
        }

        function playMusic() {
            music.play().catch(e => console.log("User interaction needed for music"));
        }

        // --- 4. WHATSAPP SHARING ---
        function shareOnWhatsApp() {
            const baseUrl = window.location.href.split('?')[0];
            // Encode name and photo URL
            const shareLink = `${baseUrl}?n=${encodeURIComponent(currentName)}&img=${encodeURIComponent(currentPhotoUrl)}`;
            
            const msg = `*${currentName}* ne aapke liye ek Special New Year Wish bheji hai! 🎁✨👇\n\nOpen here: ${shareLink}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function resetToHome() {
            window.location.href = window.location.href.split('?')[0];
        }

        // --- 5. FIREWORKS ENGINE ---
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let w, h, particles = [];
        
        function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
        window.addEventListener("resize", resize); resize();

        function random(min, max) { return Math.random() * (max - min) + min; }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y; this.color = color;
                const angle = random(0, Math.PI * 2); const speed = random(2, 6);
                this.vx = Math.cos(angle) * speed; this.vy = Math.sin(angle) * speed;
                this.alpha = 1; this.gravity = 0.05; this.friction = 0.98;
            }
            update() { this.vx *= this.friction; this.vy *= this.friction; this.vy += this.gravity; this.x += this.vx; this.y += this.vy; this.alpha -= 0.015; }
            draw() { ctx.save(); ctx.globalAlpha = this.alpha; ctx.fillStyle = this.color; ctx.beginPath(); ctx.arc(this.x, this.y, 3, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }
        }

        function createExplosion(x, y) {
            const colors = ['#ff0044', '#00ffea', '#ffeb3b', '#00ff44', '#ff00cc'];
            const color = colors[Math.floor(random(0, colors.length))];
            for (let i = 0; i < 30; i++) particles.push(new Particle(x, y, color));
        }

        function animate() {
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)"; ctx.fillRect(0, 0, w, h);
            particles.forEach((p, i) => { p.update(); p.draw(); if (p.alpha <= 0) particles.splice(i, 1); });
            if (Math.random() < 0.05) createExplosion(Math.random() > 0.5 ? 0 : w, random(0, h));
            requestAnimationFrame(animate);
        }
        animate();

        // Touch Interaction
        window.addEventListener('mousedown', e => { if(!e.target.closest('button') && !e.target.closest('input')) createExplosion(e.clientX, e.clientY); });
        window.addEventListener('touchstart', e => { if(!e.target.closest('button') && !e.target.closest('input')) createExplosion(e.touches[0].clientX, e.touches[0].clientY); });
    </script>
</body>
</html>
