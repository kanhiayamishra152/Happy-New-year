<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy New Year 2026 Wish</title>
    <style>
        /* CSS Styling */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;900&family=Great+Vibes&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: white;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Canvas for Fireworks */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Setup Screen (Form) */
        #setup-screen {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 1s ease;
        }

        .input-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            width: 90%;
            max-width: 400px;
        }

        h2 {
            margin-bottom: 20px;
            font-weight: 600;
            color: #ffd700;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 50px;
            border: none;
            outline: none;
            text-align: center;
            font-size: 16px;
        }

        input[type="file"] {
            margin: 10px 0;
            color: white;
        }

        .btn {
            background: linear-gradient(45deg, #ff0055, #ff00aa);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 18px;
            margin-top: 15px;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(255, 0, 85, 0.4);
            transition: transform 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Main Wish Screen */
        #wish-screen {
            position: absolute;
            z-index: 5;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Hidden initially */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none; /* Let clicks pass to canvas */
        }

        /* Enable pointer events only for buttons */
        #wish-screen .interactive-area {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .title-text {
            font-family: 'Great Vibes', cursive;
            font-size: 4rem;
            color: #fff;
            text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de, 0 0 40px #ff00de;
            animation: glow 2s infinite alternate;
            margin-bottom: 10px;
        }

        .year-text {
            font-size: 6rem;
            font-weight: 900;
            background: -webkit-linear-gradient(#ffe600, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0px 5px 15px rgba(255, 140, 0, 0.5);
            line-height: 1;
        }

        @keyframes glow {
            from { text-shadow: 0 0 10px #ff00de, 0 0 20px #ff00de; }
            to { text-shadow: 0 0 20px #00ffff, 0 0 40px #00ffff; }
        }

        /* Photo Container */
        .photo-wrapper {
            position: relative;
            margin: 20px 0;
            width: 200px;
            height: 200px;
        }

        .user-photo {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 2;
        }

        /* Analysis Animation Ring */
        .scan-ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 3px dashed #00ffea;
            box-shadow: 0 0 15px #00ffea;
            animation: spin 4s linear infinite;
            z-index: 1;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            font-size: 1.2rem;
            margin-top: 10px;
            color: #eee;
            background: rgba(0,0,0,0.5);
            padding: 5px 15px;
            border-radius: 15px;
        }

        .sender-name {
            font-size: 1.8rem;
            font-weight: bold;
            color: #ffd700;
            text-transform: capitalize;
            text-shadow: 0 2px 5px rgba(0,0,0,0.8);
        }

        /* Share Button */
        .whatsapp-btn {
            margin-top: 20px;
            background: #25D366;
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        /* Responsive */
        @media (max-width: 600px) {
            .title-text { font-size: 3rem; }
            .year-text { font-size: 4rem; }
            .user-photo { width: 140px; height: 140px; }
            .photo-wrapper { width: 160px; height: 160px; }
        }

        /* Processing Overlay */
        #processing {
            display: none;
            font-size: 1.5rem;
            color: #00ffea;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- Audio Player -->
    <audio id="music-player" loop>
        <source src="Happy.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Canvas for Fireworks -->
    <canvas id="canvas"></canvas>

    <!-- SETUP SCREEN: User Input -->
    <div id="setup-screen">
        <div class="input-box">
            <h1 style="font-family: 'Great Vibes'; font-size: 3rem; margin-bottom: 10px;">Welcome</h1>
            <p>Create your magic wish for 2026!</p>
            <br>
            <input type="text" id="username" placeholder="Enter Your Name" required>
            <br>
            <label style="display:block; margin-top:10px; font-size:0.9rem;">Upload Your Best Photo:</label>
            <input type="file" id="userimg" accept="image/*">
            <br>
            <div id="processing">Analysing Photo... 📸</div>
            <button class="btn" onclick="startExperience()">Create Wish ✨</button>
        </div>
    </div>

    <!-- WISH SCREEN: Final Output -->
    <div id="wish-screen">
        <div class="title-text">Happy New Year</div>
        <div class="year-text">2026</div>

        <div class="interactive-area">
            <div class="photo-wrapper">
                <div class="scan-ring"></div>
                <img src="https://via.placeholder.com/150" id="final-photo" class="user-photo" alt="User Photo">
            </div>

            <div class="message">Wishing you love & joy!</div>
            <div class="message">From:</div>
            <div class="sender-name" id="display-name">Your Name</div>

            <a href="#" class="whatsapp-btn" id="share-btn" onclick="shareOnWhatsApp()">
                Share on WhatsApp 🚀
            </a>
            
            <p style="font-size: 0.8rem; margin-top: 10px; color: #aaa;">(Tap anywhere for Fireworks!)</p>
        </div>
    </div>

    <script>
        // --- LOGIC SECTION ---

        const setupScreen = document.getElementById('setup-screen');
        const wishScreen = document.getElementById('wish-screen');
        const processing = document.getElementById('processing');
        const music = document.getElementById('music-player');
        
        let userName = "";
        let userImageSrc = "https://cdn-icons-png.flaticon.com/512/149/149071.png"; // Default Avatar

        // 1. Check URL on Load (Is user coming from a shared link?)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const sender = urlParams.get('from');
            
            if(sender) {
                // If viewing someone else's status
                userName = decodeURIComponent(sender);
                document.getElementById('display-name').innerText = userName;
                
                // Change UI for Viewer
                document.querySelector('#setup-screen h1').innerText = "Surprise!";
                document.querySelector('#setup-screen p').innerText = userName + " sent you a wish!";
                document.querySelector('.btn').innerText = "Open Wish 🎁";
                
                // Hide input fields initially to just show "Open" button logic, 
                // but for simplicity, we allow them to override creates their own later.
                // We will pre-fill the name if they want to reply.
            }
        };

        // 2. Start Experience Function
        function startExperience() {
            const nameInput = document.getElementById('username').value;
            const fileInput = document.getElementById('userimg').files[0];
            const urlParams = new URLSearchParams(window.location.search);
            const sender = urlParams.get('from');

            // If user entered a name, use it. If came from link and no input, use sender name.
            if (nameInput.trim() !== "") {
                userName = nameInput;
            } else if (sender) {
                userName = sender;
            } else {
                alert("Please enter your name!");
                return;
            }

            // Image Handling
            if (fileInput) {
                // User uploaded a photo - Simulate "Analysis"
                processing.style.display = 'block';
                
                const reader = new FileReader();
                reader.onload = function(e) {
                    userImageSrc = e.target.result;
                    launchWish(true);
                };
                reader.readAsDataURL(fileInput);
            } else {
                // No photo uploaded, proceed immediately
                launchWish(false);
            }
        }

        function launchWish(hasPhoto) {
            // Wait a bit if analyzing photo
            const delay = hasPhoto ? 1500 : 500;

            setTimeout(() => {
                // Play Music (User Interaction happened)
                music.play().catch(e => console.log("Audio play failed: ", e));

                // Update DOM
                document.getElementById('final-photo').src = userImageSrc;
                document.getElementById('display-name').innerText = userName;

                // Transition
                setupScreen.style.opacity = '0';
                setTimeout(() => {
                    setupScreen.style.display = 'none';
                    wishScreen.style.display = 'flex';
                }, 1000);

            }, delay);
        }

        // 3. Share Function
        function shareOnWhatsApp() {
            // We create a link that includes the current user's name
            const baseUrl = window.location.href.split('?')[0];
            const link = `${baseUrl}?from=${encodeURIComponent(userName)}`;
            const msg = `*${userName}* ne aapke liye ek Special 2026 Surprise bheja hai! ✨👇\n\nSee here: ${link}`;
            
            const whatsappUrl = `https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
            window.open(whatsappUrl, '_blank');
        }

        // --- FIREWORKS ENGINE (Canvas) ---
        
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");
        let w, h;
        let particles = [];

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener("resize", resize);
        resize();

        function random(min, max) {
            return Math.random() * (max - min) + min;
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                // Explosion velocity
                const angle = random(0, Math.PI * 2);
                const speed = random(2, 6);
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.gravity = 0.05;
                this.friction = 0.98;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.015;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y) {
            const colors = ['#ff0044', '#00ffea', '#ffeb3b', '#00ff44', '#ff00cc'];
            const color = colors[Math.floor(random(0, colors.length))];
            for (let i = 0; i < 40; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // Animation Loop
        function animate() {
            // Semi-transparent background for trail effect
            ctx.fillStyle = "rgba(0, 0, 0, 0.2)";
            ctx.fillRect(0, 0, w, h);

            particles.forEach((p, index) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(index, 1);
            });

            // Random Auto Fireworks at edges
            if (Math.random() < 0.05) { // 5% chance per frame
                const side = Math.random() > 0.5 ? 0 : w;
                createExplosion(side, random(0, h));
            }

            requestAnimationFrame(animate);
        }
        animate();

        // Touch/Click Interaction
        function handleInput(e) {
            // Prevent interaction on buttons
            if(e.target.closest('.whatsapp-btn') || e.target.closest('.btn') || e.target.closest('input')) return;

            let x, y;
            if(e.type === 'touchstart') {
                x = e.touches[0].clientX;
                y = e.touches[0].clientY;
            } else {
                x = e.clientX;
                y = e.clientY;
            }
            createExplosion(x, y);
            
            // Play sound effect if desired (optional)
        }

        window.addEventListener('mousedown', handleInput);
        window.addEventListener('touchstart', handleInput);

    </script>
</body>
</html>
